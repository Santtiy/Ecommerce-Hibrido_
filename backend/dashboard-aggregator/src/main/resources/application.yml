spring:
  application:
    name: dashboard-aggregator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: co.edu.proyecto.common.contratos.ResultadoTarea
        spring.json.use.type.headers: false

server:
  port: ${SERVER_PORT:8081}

app:
  origenes-permitidos: ${APP_ORIGENES:http://localhost:8081}
