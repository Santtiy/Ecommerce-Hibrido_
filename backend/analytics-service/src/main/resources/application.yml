spring:
  application:
    name: analytics-service
  main:
    web-application-type: none

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: co.edu.proyecto.common.contratos.OrdenCreada
        spring.json.use.type.headers: false
    listener:
      concurrency: 3   # un hilo por partición de new_orders

analytics:
  archivo-bitacora: ${ARCHIVO_BITACORA:./datos/ordenes.log}
