#!/usr/sbin/nft -f
# Cortafuegos del host (Ubuntu Server 24.04 en EC2).
#
# IMPORTANTE: NO usar "flush ruleset". Borraría las tablas que Docker crea para sus
# contenedores y estos perderían red y puertos. Esta tabla propia convive con las de Docker.
#
# Esta tabla filtra el tráfico dirigido al HOST (cadena input), por ejemplo sshd en el puerto 22.
# El tráfico hacia 8080 y 8081 entra por DNAT y recorre la cadena FORWARD de Docker, no input:
# a esos puertos los protege el Security Group de AWS.

table inet ecommerce_security
delete table inet ecommerce_security

table inet ecommerce_security {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        tcp dport 22 accept
        tcp dport { 8080, 8081 } accept
    }
}
